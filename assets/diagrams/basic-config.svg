<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Basic device configuration components">
  <style>
    .box { fill: var(--diagram-fill, #f4f6fb); stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; rx: 10; }
    .label { fill: var(--diagram-text, #1a202c); font: 600 14px system-ui, sans-serif; }
    .small { fill: var(--diagram-muted, #4a5568); font: 12px ui-monospace, Consolas, monospace; }
    .title { fill: var(--diagram-text, #1a202c); font: 700 16px system-ui, sans-serif; }
    .device { fill: var(--diagram-device, #e6fffa); stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; }
  </style>

  <text class="title" x="380" y="28" text-anchor="middle">Common Device Setup Tasks</text>

  <rect class="device" x="320" y="120" width="120" height="60" rx="8"/>
  <text class="label" x="380" y="144" text-anchor="middle">R1</text>
  <text class="small" x="380" y="164" text-anchor="middle">router</text>

  <rect class="box" x="40" y="60" width="220" height="60"/>
  <text class="label" x="150" y="83" text-anchor="middle">Hostname</text>
  <text class="small" x="150" y="103" text-anchor="middle">hostname R1</text>

  <rect class="box" x="500" y="60" width="220" height="60"/>
  <text class="label" x="610" y="83" text-anchor="middle">Banner</text>
  <text class="small" x="610" y="103" text-anchor="middle">banner motd #...#</text>

  <rect class="box" x="40" y="180" width="220" height="60"/>
  <text class="label" x="150" y="203" text-anchor="middle">DNS Lookup</text>
  <text class="small" x="150" y="223" text-anchor="middle">no ip domain-lookup</text>

  <rect class="box" x="500" y="180" width="220" height="60"/>
  <text class="label" x="610" y="203" text-anchor="middle">Domain Name</text>
  <text class="small" x="610" y="223" text-anchor="middle">ip domain-name lab.local</text>

  <rect class="box" x="270" y="240" width="220" height="60"/>
  <text class="label" x="380" y="263" text-anchor="middle">Password Encryption</text>
  <text class="small" x="380" y="283" text-anchor="middle">service password-encryption</text>

  <line x1="260" y1="90"  x2="320" y2="135" stroke="var(--diagram-arrow, #3182ce)" stroke-width="2"/>
  <line x1="500" y1="90"  x2="440" y2="135" stroke="var(--diagram-arrow, #3182ce)" stroke-width="2"/>
  <line x1="260" y1="210" x2="320" y2="170" stroke="var(--diagram-arrow, #3182ce)" stroke-width="2"/>
  <line x1="500" y1="210" x2="440" y2="170" stroke="var(--diagram-arrow, #3182ce)" stroke-width="2"/>
  <line x1="380" y1="240" x2="380" y2="180" stroke="var(--diagram-arrow, #3182ce)" stroke-width="2"/>
</svg>
