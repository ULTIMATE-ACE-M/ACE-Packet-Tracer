<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Spanning Tree topology with blocked port">
  <style>
    .label { fill: var(--diagram-text, #1a202c); font: 600 14px system-ui, sans-serif; }
    .small { fill: var(--diagram-muted, #4a5568); font: 12px ui-monospace, Consolas, monospace; }
    .title { fill: var(--diagram-text, #1a202c); font: 700 16px system-ui, sans-serif; }
    .switch { fill: var(--diagram-switch, #fefcbf); stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; }
    .root   { fill: var(--diagram-router, #c6f6d5); stroke: var(--diagram-stroke, #2c5282); stroke-width: 3; }
    .fwd    { stroke: var(--diagram-arrow, #38a169); stroke-width: 3; }
    .blk    { stroke: var(--diagram-accent, #e53e3e); stroke-width: 3; stroke-dasharray: 8,5; }
    .crown  { fill: var(--diagram-accent, #d69e2e); }
  </style>

  <text class="title" x="380" y="28" text-anchor="middle">Spanning Tree — One Loop, One Blocked Port</text>

  <rect class="root" x="320" y="60" width="120" height="56" rx="8"/>
  <text class="label" x="380" y="86" text-anchor="middle">SW1 (Root)</text>
  <text class="small" x="380" y="104" text-anchor="middle">priority 4096</text>
  <polygon class="crown" points="365,52 380,38 395,52 388,52 385,46 380,52 375,46 372,52" />

  <rect class="switch" x="160" y="220" width="120" height="56" rx="8"/>
  <text class="label" x="220" y="246" text-anchor="middle">SW2</text>
  <text class="small" x="220" y="264" text-anchor="middle">priority 32768</text>

  <rect class="switch" x="480" y="220" width="120" height="56" rx="8"/>
  <text class="label" x="540" y="246" text-anchor="middle">SW3</text>
  <text class="small" x="540" y="264" text-anchor="middle">priority 32768</text>

  <line class="fwd" x1="340" y1="116" x2="240" y2="220"/>
  <line class="fwd" x1="420" y1="116" x2="520" y2="220"/>

  <line class="blk" x1="280" y1="248" x2="480" y2="248"/>

  <text class="small" x="290" y="158" text-anchor="middle">forwarding</text>
  <text class="small" x="470" y="158" text-anchor="middle">forwarding</text>
  <text class="small" x="380" y="240" text-anchor="middle" fill="var(--diagram-accent,#e53e3e)">BLOCKING</text>

  <rect x="60" y="310" width="20" height="6" fill="var(--diagram-arrow,#38a169)"/>
  <text class="small" x="90" y="316">forwarding</text>
  <line class="blk" x1="200" y1="313" x2="220" y2="313"/>
  <text class="small" x="230" y="316">blocking (still receives BPDUs)</text>

  <text class="small" x="380" y="345" text-anchor="middle">Lowest bridge ID becomes the Root. Other switches block the redundant path to break the loop.</text>
</svg>
