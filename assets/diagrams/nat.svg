<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="NAT translation diagram">
  <style>
    .label { fill: var(--diagram-text, #1a202c); font: 600 14px system-ui, sans-serif; }
    .small { fill: var(--diagram-muted, #4a5568); font: 12px ui-monospace, Consolas, monospace; }
    .title { fill: var(--diagram-text, #1a202c); font: 700 16px system-ui, sans-serif; }
    .pc { fill: var(--diagram-pc, #fff5f5); stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; }
    .router { fill: var(--diagram-router, #c6f6d5); stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; }
    .cloud { fill: var(--diagram-cloud, #ebf8ff); stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; }
    .table { fill: var(--diagram-fill, #f4f6fb); stroke: var(--diagram-stroke, #2c5282); stroke-width: 1.5; }
    .link { stroke: var(--diagram-arrow, #3182ce); stroke-width: 2; }
  </style>

  <text class="title" x="380" y="28" text-anchor="middle">PAT (NAT Overload) — Many Inside, One Outside</text>

  <rect class="pc" x="40" y="60"  width="100" height="44" rx="6"/>
  <text class="label" x="90" y="82"  text-anchor="middle">PC1</text>
  <text class="small" x="90" y="98" text-anchor="middle">192.168.1.10</text>
  <rect class="pc" x="40" y="130" width="100" height="44" rx="6"/>
  <text class="label" x="90" y="152" text-anchor="middle">PC2</text>
  <text class="small" x="90" y="168" text-anchor="middle">192.168.1.11</text>
  <rect class="pc" x="40" y="200" width="100" height="44" rx="6"/>
  <text class="label" x="90" y="222" text-anchor="middle">PC3</text>
  <text class="small" x="90" y="238" text-anchor="middle">192.168.1.12</text>

  <rect class="router" x="280" y="120" width="200" height="80" rx="10"/>
  <text class="label" x="380" y="148" text-anchor="middle">R1 — NAT Border</text>
  <text class="small" x="320" y="180" text-anchor="middle">inside</text>
  <text class="small" x="440" y="180" text-anchor="middle">outside</text>
  <text class="small" x="380" y="195" text-anchor="middle">203.0.113.5</text>

  <ellipse class="cloud" cx="660" cy="160" rx="80" ry="40"/>
  <text class="label" x="660" y="165" text-anchor="middle">Internet</text>

  <line class="link" x1="140" y1="82"  x2="280" y2="140"/>
  <line class="link" x1="140" y1="152" x2="280" y2="160"/>
  <line class="link" x1="140" y1="222" x2="280" y2="180"/>
  <line class="link" x1="480" y1="160" x2="580" y2="160"/>

  <rect class="table" x="100" y="270" width="560" height="60" rx="6"/>
  <text class="small" x="380" y="288" text-anchor="middle" font-weight="700">NAT Translation Table</text>
  <text class="small" x="120" y="308">Inside Local           Inside Global          Outside</text>
  <text class="small" x="120" y="324">192.168.1.10:5001 → 203.0.113.5:5001 → 8.8.8.8:443</text>
  <text class="small" x="430" y="324">  PC2 → 5002, PC3 → 5003 (port-multiplexed)</text>
</svg>
