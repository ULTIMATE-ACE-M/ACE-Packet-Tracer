<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Router with LAN and WAN interfaces">
  <style>
    .label { fill: var(--diagram-text, #1a202c); font: 600 14px system-ui, sans-serif; }
    .small { fill: var(--diagram-muted, #4a5568); font: 12px ui-monospace, Consolas, monospace; }
    .title { fill: var(--diagram-text, #1a202c); font: 700 16px system-ui, sans-serif; }
    .pc { fill: var(--diagram-pc, #fff5f5); stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; }
    .switch { fill: var(--diagram-switch, #fefcbf); stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; }
    .router { fill: var(--diagram-router, #c6f6d5); stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; }
    .cloud { fill: var(--diagram-cloud, #ebf8ff); stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; }
    .link { stroke: var(--diagram-arrow, #3182ce); stroke-width: 2; fill: none; }
  </style>

  <text class="title" x="380" y="28" text-anchor="middle">Router Interfaces — LAN ↔ WAN</text>

  <rect class="pc" x="40" y="120" width="80" height="56" rx="6"/>
  <text class="label" x="80" y="144" text-anchor="middle">PC1</text>
  <text class="small" x="80" y="162" text-anchor="middle">.10</text>

  <rect class="switch" x="180" y="125" width="100" height="48" rx="6"/>
  <text class="label" x="230" y="153" text-anchor="middle">SW1</text>

  <rect class="router" x="340" y="115" width="120" height="68" rx="10"/>
  <text class="label" x="400" y="140" text-anchor="middle">R1</text>
  <circle cx="358" cy="160" r="5" fill="var(--diagram-arrow,#3182ce)"/>
  <circle cx="442" cy="160" r="5" fill="var(--diagram-arrow,#3182ce)"/>
  <text class="small" x="358" y="178" text-anchor="middle">G0/0</text>
  <text class="small" x="442" y="178" text-anchor="middle">G0/1</text>

  <ellipse class="cloud" cx="640" cy="150" rx="80" ry="40"/>
  <text class="label" x="640" y="155" text-anchor="middle">Internet</text>

  <line class="link" x1="120" y1="148" x2="180" y2="148"/>
  <line class="link" x1="280" y1="148" x2="358" y2="160"/>
  <line class="link" x1="442" y1="160" x2="560" y2="150"/>

  <text class="small" x="240" y="115" text-anchor="middle">192.168.1.0/24</text>
  <text class="small" x="500" y="135" text-anchor="middle">203.0.113.0/30</text>

  <rect x="40"  y="235" width="320" height="55" rx="6" fill="var(--diagram-fill,#f4f6fb)" stroke="var(--diagram-stroke,#2c5282)"/>
  <text class="small" x="200" y="255" text-anchor="middle">interface g0/0</text>
  <text class="small" x="200" y="271" text-anchor="middle">ip address 192.168.1.1 255.255.255.0</text>
  <text class="small" x="200" y="285" text-anchor="middle">no shutdown</text>

  <rect x="400" y="235" width="320" height="55" rx="6" fill="var(--diagram-fill,#f4f6fb)" stroke="var(--diagram-stroke,#2c5282)"/>
  <text class="small" x="560" y="255" text-anchor="middle">interface g0/1</text>
  <text class="small" x="560" y="271" text-anchor="middle">ip address 203.0.113.1 255.255.255.252</text>
  <text class="small" x="560" y="285" text-anchor="middle">no shutdown</text>
</svg>
