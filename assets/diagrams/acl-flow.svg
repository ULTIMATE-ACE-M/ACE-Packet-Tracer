<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="ACL evaluation flow">
  <style>
    .label { fill: var(--diagram-text, #1a202c); font: 600 14px system-ui, sans-serif; }
    .small { fill: var(--diagram-muted, #4a5568); font: 12px ui-monospace, Consolas, monospace; }
    .title { fill: var(--diagram-text, #1a202c); font: 700 16px system-ui, sans-serif; }
    .box { fill: var(--diagram-fill, #f4f6fb); stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; }
    .deny { fill: #fed7d7; stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; }
    .permit { fill: #c6f6d5; stroke: var(--diagram-stroke, #2c5282); stroke-width: 2; }
    .arrow { fill: none; stroke: var(--diagram-arrow, #3182ce); stroke-width: 2; marker-end: url(#a3); }
    .yes { fill: var(--diagram-arrow, #38a169); font: 700 12px system-ui, sans-serif; }
    .no  { fill: var(--diagram-accent, #e53e3e); font: 700 12px system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--diagram-arrow,#3182ce)"/>
    </marker>
  </defs>

  <text class="title" x="380" y="28" text-anchor="middle">ACL Evaluation — Top-Down, First Match Wins</text>

  <rect class="box" x="320" y="50"  width="120" height="40" rx="6"/>
  <text class="label" x="380" y="75" text-anchor="middle">Packet arrives</text>

  <rect class="box" x="290" y="120" width="180" height="50" rx="6"/>
  <text class="label" x="380" y="142" text-anchor="middle">Match line 1?</text>
  <text class="small" x="380" y="160" text-anchor="middle">e.g. permit 192.168.1.0/24</text>

  <rect class="box" x="290" y="200" width="180" height="50" rx="6"/>
  <text class="label" x="380" y="222" text-anchor="middle">Match line 2?</text>
  <text class="small" x="380" y="240" text-anchor="middle">e.g. deny 10.0.0.0/8</text>

  <rect class="box" x="290" y="280" width="180" height="50" rx="6"/>
  <text class="label" x="380" y="302" text-anchor="middle">Match line N?</text>

  <rect class="permit" x="60" y="160" width="160" height="50" rx="6"/>
  <text class="label" x="140" y="182" text-anchor="middle">PERMIT</text>
  <text class="small" x="140" y="200" text-anchor="middle">forward the packet</text>

  <rect class="deny" x="540" y="240" width="160" height="50" rx="6"/>
  <text class="label" x="620" y="262" text-anchor="middle">DENY</text>
  <text class="small" x="620" y="280" text-anchor="middle">drop the packet</text>

  <rect class="deny" x="290" y="340" width="180" height="30" rx="6"/>
  <text class="small" x="380" y="360" text-anchor="middle">Implicit DENY at the end</text>

  <path class="arrow" d="M380 90 L380 120"/>

  <path class="arrow" d="M290 145 L220 185"/>
  <text class="yes" x="240" y="160">yes</text>
  <path class="arrow" d="M380 170 L380 200"/>
  <text class="no" x="395" y="190">no</text>

  <path class="arrow" d="M470 225 L540 265"/>
  <text class="no" x="495" y="245">yes</text>
  <path class="arrow" d="M380 250 L380 280"/>
  <text class="no" x="395" y="270">no</text>

  <path class="arrow" d="M380 330 L380 340"/>
</svg>
